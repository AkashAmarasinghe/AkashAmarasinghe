<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="185" viewBox="0 0 1100 185" role="img" aria-label="Code with purpose build with passion">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#16080e"/><stop offset=".49" stop-color="#210e13"/><stop offset="1" stop-color="#100b11"/></linearGradient>
<linearGradient id="fire" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff334e"/><stop offset=".47" stop-color="#ff8a28"/><stop offset="1" stop-color="#ffe063"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".18"/><stop offset=".45" stop-color="#fff" stop-opacity=".055"/><stop offset="1" stop-color="#ffb341" stop-opacity=".045"/></linearGradient>
<radialGradient id="glowRed"><stop stop-color="#ef3545" stop-opacity=".52"/><stop offset="1" stop-color="#ef3545" stop-opacity="0"/></radialGradient>
<radialGradient id="glowGold"><stop stop-color="#ffa72e" stop-opacity=".5"/><stop offset="1" stop-color="#ffa72e" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/></pattern>
<filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000" flood-opacity=".55"/></filter>
</defs>
<rect width="1100" height="185" rx="22" fill="url(#bg)"/><rect width="1100" height="185" rx="22" fill="url(#grid)"/>
<ellipse cx="300" cy="80" rx="340" ry="190" fill="url(#glowRed)"/><ellipse cx="940" cy="115" rx="280" ry="180" fill="url(#glowGold)"/>
<rect x="18" y="17" width="1064" height="149" rx="18" fill="url(#glass)" stroke="#fff" stroke-opacity=".24"/>
<text x="550" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="900" letter-spacing="3" fill="#fff5ef">CODE WITH PURPOSE.</text>
<text x="550" y="110" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="900" letter-spacing="3" fill="url(#fire)">BUILD WITH PASSION.</text>
<text x="550" y="142" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="3" fill="#f4cbb5">LEARN  /  BUILD  /  EVOLVE</text>
<rect y="181" width="1100" height="4" rx="2" fill="url(#fire)"/>
</svg>